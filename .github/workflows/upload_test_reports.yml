name: Upload Test Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Backend API Security Report
        uses: actions/upload-artifact@v4
        with:
          name: Backend_API_Security_Report
          path: Final_Test_Reports/Backend_API_Security_Report_v2.xlsx

      - name: Upload Frontend E2E Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Frontend_E2E_Test_Report
          path: Final_Test_Reports/Frontend_E2E_Test_Report_v2.xlsx

      - name: Upload Load Testing Report
        uses: actions/upload-artifact@v4
        with:
          name: Load_Testing_Report
          path: Final_Test_Reports/Load_Testing_Report_v2.xlsx

      - name: Upload Mobile App Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Mobile_App_Test_Report
          path: Final_Test_Reports/Mobile_App_Test_Report_v2.xlsx
